<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>塔罗后台数据</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #07161b;
			--panel: rgba(9, 27, 33, 0.82);
			--panel-strong: rgba(12, 35, 43, 0.92);
			--text: #f7f1e2;
			--muted: rgba(247, 241, 226, 0.66);
			--line: rgba(255, 255, 255, 0.08);
			--accent: #ffcf75;
			--accent-soft: rgba(255, 207, 117, 0.14);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			font-family: 'Noto Serif SC', serif;
			background:
				radial-gradient(circle at top, rgba(255, 207, 117, 0.12), transparent 28%),
				linear-gradient(180deg, #08181d 0%, #061116 100%);
			color: var(--text);
		}

		a { color: inherit; }

		.page {
			width: min(1120px, calc(100vw - 28px));
			margin: 0 auto;
			padding: 28px 0 36px;
			display: grid;
			gap: 18px;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 26px;
			padding: 20px;
			backdrop-filter: blur(18px);
			box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
		}

		.header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 16px;
		}

		h1, h2, h3 {
			margin: 0;
			font-family: 'Cormorant Garamond', serif;
		}

		h1 {
			font-size: clamp(34px, 6vw, 52px);
			line-height: 1.02;
		}

		h2 {
			font-size: 28px;
		}

		.kicker {
			display: inline-flex;
			padding: 6px 12px;
			border-radius: 999px;
			font-size: 12px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			background: var(--accent-soft);
			color: var(--accent);
		}

		.status-pill {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 7px 12px;
			border-radius: 999px;
			font-size: 12px;
			color: var(--accent);
			background: rgba(255, 207, 117, 0.14);
			border: 1px solid rgba(255, 207, 117, 0.2);
		}

		.actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		.button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 46px;
			padding: 0 16px;
			border-radius: 16px;
			text-decoration: none;
			border: 1px solid var(--line);
			background: rgba(255, 255, 255, 0.04);
			color: var(--text);
			cursor: pointer;
			font: inherit;
		}

		.button.primary {
			background: linear-gradient(135deg, #ffcf75, #c9883e);
			color: #102227;
			border: none;
			font-weight: 700;
		}

		.summary-grid,
		.user-list {
			display: grid;
			gap: 12px;
		}

		.summary-grid {
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			margin-top: 18px;
		}

		.meta-card,
		.user-card,
		.state-card {
			padding: 16px;
			border-radius: 18px;
			background: var(--panel-strong);
			border: 1px solid var(--line);
		}

		.meta-card {
			display: grid;
			gap: 6px;
		}

		.meta-card span,
		.user-card p,
		.state-card p,
		.user-meta {
			color: var(--muted);
			font-size: 13px;
			line-height: 1.7;
			margin: 0;
		}

		.meta-card strong {
			font-size: 22px;
			color: var(--text);
		}

		.user-card {
			display: grid;
			gap: 8px;
		}

		.user-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
		}

		.user-tags {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.user-tags span {
			padding: 6px 10px;
			border-radius: 999px;
			background: rgba(255,255,255,0.04);
			border: 1px solid var(--line);
			font-size: 12px;
			color: var(--muted);
		}

		.hidden {
			display: none;
		}

		@media (max-width: 640px) {
			.page {
				width: min(100vw - 20px, 1120px);
				padding-top: 18px;
			}

			.header {
				flex-direction: column;
			}

			.actions {
				width: 100%;
			}

			.button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<section class="panel">
			<div class="header">
				<div>
					<div class="kicker">Admin Dashboard</div>
					<h1>后台数据总览</h1>
					<p id="pageIntro" style="margin: 12px 0 0; color: var(--muted); line-height: 1.8;">加载中，正在验证登录状态与管理员权限。</p>
				</div>
				<div class="actions">
					<span class="status-pill" id="adminStatus">校验中</span>
					<button class="button primary" id="refreshButton" type="button">刷新数据</button>
					<a class="button" href="/">返回占卜页</a>
				</div>
			</div>
		</section>

		<section class="panel hidden" id="errorPanel">
			<div class="state-card">
				<h2 id="errorTitle">无法访问后台</h2>
				<p id="errorText" style="margin-top: 10px;">请先登录管理员账号。</p>
			</div>
		</section>

		<section class="panel hidden" id="dashboardPanel">
			<h2>概览数据</h2>
			<div class="summary-grid" id="summaryGrid"></div>
		</section>

		<section class="panel hidden" id="usersPanel">
			<h2>用户列表</h2>
			<div class="user-list" id="usersList" style="margin-top: 18px;"></div>
		</section>
	</div>

	<script>
		const AUTH_SESSION_ENDPOINT = '/api/auth/session';
		const ADMIN_DASHBOARD_ENDPOINT = '/api/admin/dashboard';

		const adminStatus = document.getElementById('adminStatus');
		const pageIntro = document.getElementById('pageIntro');
		const refreshButton = document.getElementById('refreshButton');
		const errorPanel = document.getElementById('errorPanel');
		const errorTitle = document.getElementById('errorTitle');
		const errorText = document.getElementById('errorText');
		const dashboardPanel = document.getElementById('dashboardPanel');
		const usersPanel = document.getElementById('usersPanel');
		const summaryGrid = document.getElementById('summaryGrid');
		const usersList = document.getElementById('usersList');

		function formatMoney(value) {
			return `￥${Number(value || 0).toFixed(1)}`;
		}

		function formatDateTime(value) {
			if (!value) {
				return '暂无';
			}
			const date = new Date(value);
			if (Number.isNaN(date.getTime())) {
				return '暂无';
			}
			return date.toLocaleString('zh-CN', {
				month: '2-digit',
				day: '2-digit',
				hour: '2-digit',
				minute: '2-digit'
			});
		}

		async function requestJson(url) {
			const response = await fetch(url, { credentials: 'same-origin' });
			const text = await response.text();
			let data = {};
			if (text) {
				data = JSON.parse(text);
			}
			if (!response.ok) {
				const error = new Error(data.error || `请求失败：${response.status}`);
				error.status = response.status;
				throw error;
			}
			return data;
		}

		function showError(title, text) {
			adminStatus.textContent = '不可访问';
			pageIntro.textContent = text;
			errorTitle.textContent = title;
			errorText.textContent = text;
			errorPanel.classList.remove('hidden');
			dashboardPanel.classList.add('hidden');
			usersPanel.classList.add('hidden');
		}

		function renderDashboard(data) {
			adminStatus.textContent = '管理员';
			pageIntro.textContent = '当前展示的是所有用户的注册、解读、签到和充值汇总数据。';
			errorPanel.classList.add('hidden');
			dashboardPanel.classList.remove('hidden');
			usersPanel.classList.remove('hidden');

			const { stats, users } = data;
			summaryGrid.innerHTML = [
				{ label: '总用户数', value: `${stats.totalUsers}` },
				{ label: '累计解读', value: `${stats.totalReadings} 次` },
				{ label: '总消耗积分', value: `${stats.totalCreditsSpent} 积分` },
				{ label: '总充值金额', value: formatMoney(stats.totalRechargeAmount) },
				{ label: '总充值积分', value: `${stats.totalRechargeCredits} 积分` },
				{ label: '今日签到', value: `${stats.todayCheckIns} 人` }
			].map((item) => `
				<div class="meta-card">
					<span>${item.label}</span>
					<strong>${item.value}</strong>
				</div>
			`).join('');

			usersList.innerHTML = users.length
				? users.map((user) => `
					<div class="user-card">
						<div class="user-head">
							<h3>${user.username}</h3>
							<span class="status-pill">${user.isAdmin ? '管理员' : '普通用户'}</span>
						</div>
						<p>${user.email}</p>
						<div class="user-tags">
							<span>积分 ${user.credits}</span>
							<span>解读 ${user.readingCount} 次</span>
							<span>消耗 ${user.totalCreditsSpent} 积分</span>
							<span>充值 ${user.totalRechargeCredits} 积分</span>
						</div>
						<p class="user-meta">注册时间：${formatDateTime(user.createdAt)} ｜ 上次签到：${user.lastCheckInDate || '暂无'} ｜ 上次解读：${formatDateTime(user.lastReadingAt)}</p>
						<p>${Array.isArray(user.activityLogs) && user.activityLogs.length ? `最近记录：${user.activityLogs[0].summary}` : '暂无最近记录。'}</p>
					</div>
				`).join('')
				: '<div class="state-card"><p>当前没有用户数据。</p></div>';
		}

		async function loadAdminDashboard() {
			refreshButton.disabled = true;
			try {
				const session = await requestJson(AUTH_SESSION_ENDPOINT);
				if (!session.user) {
					showError('尚未登录', '请先回到账户页登录管理员账号，再访问后台数据页。');
					return;
				}
				if (!session.user.isAdmin) {
					showError('权限不足', '当前账号不是管理员，无法查看后台数据。');
					return;
				}

				const dashboard = await requestJson(ADMIN_DASHBOARD_ENDPOINT);
				renderDashboard(dashboard);
			} catch (error) {
				showError('加载失败', error.message || '后台数据加载失败。');
			} finally {
				refreshButton.disabled = false;
			}
		}

		refreshButton.addEventListener('click', loadAdminDashboard);
		loadAdminDashboard();
	</script>
</body>
</html>
